<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="hexTitle hexDesc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" shape-rendering="geometricPrecision">
  <title id="hexTitle">Hex local voice dictation pipeline</title>
  <desc id="hexDesc">Audio captured from a PipeWire microphone passes a Silero voice activity gate into the Parakeet ASR model on the Vulkan iGPU, through deterministic cleanup, and into the focused app through a Wayland portal or terminal paste.</desc>

  <defs>
    <radialGradient id="bgGrad3" cx="50%" cy="0%" r="120%">
      <stop offset="0" stop-color="#282828"/>
      <stop offset="1" stop-color="#1d2021"/>
    </radialGradient>
    <radialGradient id="gpuGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fabd2f" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fabd2f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3c3836" stroke-width="1"/>
    </pattern>
    <filter id="glow3" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowO3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#fe8019"/>
    </marker>
    <marker id="arrowY3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#fabd2f"/>
    </marker>
    <marker id="arrowP3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d3869b"/>
    </marker>
    <path id="c1" d="M 288 280 H 328"/>
    <path id="c2" d="M 580 280 H 620"/>
    <path id="c3" d="M 872 280 H 912"/>
  </defs>

  <style>
    .h1 { font-size: 28px; font-weight: 700; fill: #ebdbb2; letter-spacing: -.3px; }
    .sub { font-size: 13.5px; fill: #928374; }
    .badge-text { font-size: 10px; font-weight: 700; fill: #fabd2f; letter-spacing: 2px; }
    .section { font-size: 10.5px; font-weight: 700; letter-spacing: 2.2px; }
    .stage-title { font-size: 17px; font-weight: 700; fill: #ebdbb2; }
    .body { font-size: 10.5px; fill: #d5c4a1; }
    .muted { font-size: 9.5px; fill: #928374; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .code-sm { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 9.5px; fill: #928374; }
    .token-text { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 9px; fill: #d5c4a1; }
    .wbar { transform-box: fill-box; transform-origin: center bottom; animation: wave 1.1s ease-in-out infinite; }
    .dot { transform-box: fill-box; transform-origin: center; animation: dotPulse 1.6s ease-in-out infinite; }
    .blink { animation: blink 1.05s steps(1, end) infinite; }
    .tokFlow { animation: tokFlow 3.8s linear infinite; }
    .dash { stroke-dasharray: 4 14; animation: dash 1.5s linear infinite; }
    @keyframes wave {
      0%, 100% { transform: scaleY(.3); }
      50% { transform: scaleY(1); }
    }
    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.65); opacity: .35; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes tokFlow {
      from { transform: translateX(0); }
      to { transform: translateX(260px); }
    }
    @keyframes dash { to { stroke-dashoffset: -36; } }
    @media (prefers-reduced-motion: reduce) {
      .wbar, .dot, .blink, .tokFlow, .dash { animation: none; }
    }
  </style>

  <rect width="1200" height="620" fill="url(#bgGrad3)"/>
  <rect width="1200" height="620" fill="url(#grid3)" opacity=".28"/>

  <!-- Header -->
  <rect x="48" y="30" width="5" height="28" rx="2.5" fill="#fabd2f"/>
  <text class="h1" x="66" y="54">Hex voice pipeline</text>
  <text class="sub" x="66" y="78">Speech to text on the local GPU, injected at the cursor.</text>
  <rect x="920" y="34" width="244" height="34" rx="17" fill="#282828" stroke="#504945"/>
  <text class="badge-text" x="1042" y="56" text-anchor="middle">100% LOCAL · VULKAN</text>

  <!-- Stage 1: capture -->
  <rect x="36" y="108" width="252" height="342" rx="16" fill="#282828" stroke="#504945"/>
  <rect x="60" y="129" width="6" height="6" rx="1.5" fill="#fe8019"/>
  <text class="section" x="74" y="136" fill="#fe8019">01 · CAPTURE</text>
  <text class="stage-title" x="60" y="162">Audio capture</text>
  <text class="code-sm" x="60" y="180">F8 hotkey</text>

  <g fill="#fe8019">
    <rect class="wbar" x="60" y="242" width="8" height="16" rx="4" style="animation-delay:-0.05s"/>
    <rect class="wbar" x="76" y="226" width="8" height="32" rx="4" fill="#fabd2f" style="animation-delay:-0.25s"/>
    <rect class="wbar" x="92" y="210" width="8" height="48" rx="4" style="animation-delay:-0.45s"/>
    <rect class="wbar" x="108" y="234" width="8" height="24" rx="4" fill="#fabd2f" style="animation-delay:-0.15s"/>
    <rect class="wbar" x="124" y="202" width="8" height="56" rx="4" style="animation-delay:-0.65s"/>
    <rect class="wbar" x="140" y="192" width="8" height="66" rx="4" fill="#fabd2f" style="animation-delay:-0.35s"/>
    <rect class="wbar" x="156" y="218" width="8" height="40" rx="4" style="animation-delay:-0.55s"/>
    <rect class="wbar" x="172" y="198" width="8" height="60" rx="4" fill="#fabd2f" style="animation-delay:-0.1s"/>
    <rect class="wbar" x="188" y="228" width="8" height="30" rx="4" style="animation-delay:-0.8s"/>
    <rect class="wbar" x="204" y="208" width="8" height="50" rx="4" fill="#fabd2f" style="animation-delay:-0.3s"/>
    <rect class="wbar" x="220" y="222" width="8" height="36" rx="4" style="animation-delay:-0.7s"/>
    <rect class="wbar" x="236" y="236" width="8" height="22" rx="4" fill="#fabd2f" style="animation-delay:-0.2s"/>
    <rect class="wbar" x="252" y="246" width="8" height="12" rx="4" style="animation-delay:-0.6s"/>
  </g>

  <line x1="60" y1="274" x2="288" y2="274" stroke="#3c3836"/>
  <circle cx="64" cy="294" r="2.5" fill="#fe8019"/>
  <text class="body" x="76" y="298">PipeWire microphone</text>
  <circle cx="64" cy="316" r="2.5" fill="#fabd2f"/>
  <text class="body" x="76" y="320">silero-vad-v6.2 gate</text>
  <circle cx="64" cy="338" r="2.5" fill="#8ec07c"/>
  <text class="body" x="76" y="342">speech buffer → ASR</text>

  <rect x="60" y="364" width="216" height="36" rx="10" fill="#1d2021" stroke="#3c3836"/>
  <circle class="dot" cx="76" cy="382" r="4" fill="#fe8019"/>
  <text class="mono" x="90" y="386" font-size="9.5" fill="#d5c4a1">VAD open · speech</text>
  <text class="muted" x="60" y="426">double-tap F8 to lock</text>

  <!-- Stage 2: ASR -->
  <rect x="328" y="108" width="252" height="342" rx="16" fill="#282828" stroke="#504945"/>
  <rect x="352" y="129" width="6" height="6" rx="1.5" fill="#fabd2f"/>
  <text class="section" x="366" y="136" fill="#fabd2f">02 · ASR</text>
  <text class="stage-title" x="352" y="162">Local ASR</text>
  <text class="code-sm" x="352" y="180">Vulkan iGPU · streaming</text>

  <rect x="352" y="194" width="216" height="62" rx="8" fill="#1d2021" stroke="#3c3836"/>
  <text class="mono" x="364" y="218" font-size="10" fill="#ebdbb2">parakeet-unified-en</text>
  <text class="code-sm" x="364" y="236">0.6b · Q8_0 · GGUF</text>

  <circle cx="468" cy="298" r="40" fill="url(#gpuGlow3)" opacity=".55"/>
  <g>
    <circle cx="468" cy="298" r="20" fill="none" stroke="#fabd2f" stroke-opacity=".6">
      <animate attributeName="r" values="18;34" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="468" cy="298" r="14" fill="#3c3836" stroke="#fabd2f"/>
    <text class="mono" x="468" y="301.5" font-size="8.5" font-weight="700" fill="#fabd2f" text-anchor="middle">GPU</text>
  </g>

  <circle cx="356" cy="340" r="2.5" fill="#fabd2f"/>
  <text class="body" x="368" y="344">real-time transcription</text>
  <circle cx="356" cy="362" r="2.5" fill="#d3869b"/>
  <text class="body" x="368" y="366">token stream → cleanup</text>
  <circle cx="356" cy="384" r="2.5" fill="#83a598"/>
  <text class="body" x="368" y="388">weights stay in VRAM</text>

  <!-- Stage 3: cleanup -->
  <rect x="620" y="108" width="252" height="342" rx="16" fill="#282828" stroke="#504945"/>
  <rect x="644" y="129" width="6" height="6" rx="1.5" fill="#d3869b"/>
  <text class="section" x="658" y="136" fill="#d3869b">03 · CLEANUP</text>
  <text class="stage-title" x="644" y="162">Cleanup pipeline</text>
  <text class="code-sm" x="644" y="180">deterministic · local</text>

  <rect x="644" y="196" width="18" height="18" rx="5" fill="#3c3836" stroke="#d3869b" stroke-opacity=".6"/>
  <text class="mono" x="653" y="209" font-size="8.5" fill="#d3869b" text-anchor="middle">1</text>
  <text class="body" x="672" y="210">Spoken formatting</text>
  <text class="code-sm" x="672" y="228">&quot;new paragraph&quot; → ¶</text>

  <rect x="644" y="244" width="18" height="18" rx="5" fill="#3c3836" stroke="#d3869b" stroke-opacity=".6"/>
  <text class="mono" x="653" y="257" font-size="8.5" fill="#d3869b" text-anchor="middle">2</text>
  <text class="body" x="672" y="258">Symbol conversion</text>
  <text class="code-sm" x="672" y="276">&quot;underscore&quot; → _</text>

  <rect x="644" y="292" width="18" height="18" rx="5" fill="#3c3836" stroke="#d3869b" stroke-opacity=".6"/>
  <text class="mono" x="653" y="305" font-size="8.5" fill="#d3869b" text-anchor="middle">3</text>
  <text class="body" x="672" y="306">Filler removal</text>
  <text class="code-sm" x="672" y="324">um · uh · like</text>

  <rect x="644" y="340" width="18" height="18" rx="5" fill="#3c3836" stroke="#d3869b" stroke-opacity=".6"/>
  <text class="mono" x="653" y="353" font-size="8.5" fill="#d3869b" text-anchor="middle">4</text>
  <text class="body" x="672" y="354">Smart spacing</text>
  <text class="code-sm" x="672" y="372">punctuation + casing</text>

  <rect x="644" y="394" width="180" height="30" rx="8" fill="#1d2021" stroke="#3c3836"/>
  <path d="M 656 409 L 661 414 L 670 404" fill="none" stroke="#b8bb26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono" x="680" y="413" font-size="9" fill="#b8bb26">no model calls</text>

  <!-- Stage 4: injection -->
  <rect x="912" y="108" width="252" height="342" rx="16" fill="#282828" stroke="#504945"/>
  <rect x="936" y="129" width="6" height="6" rx="1.5" fill="#8ec07c"/>
  <text class="section" x="950" y="136" fill="#8ec07c">04 · INJECTION</text>
  <text class="stage-title" x="936" y="162">Session injection</text>
  <text class="code-sm" x="936" y="180">Wayland portal · paste</text>

  <rect x="936" y="194" width="204" height="118" rx="8" fill="#1d2021" stroke="#3c3836"/>
  <line x1="936" y1="212" x2="1140" y2="212" stroke="#3c3836"/>
  <circle cx="948" cy="203" r="3" fill="#fb4934"/>
  <circle cx="958" cy="203" r="3" fill="#fabd2f"/>
  <circle cx="968" cy="203" r="3" fill="#b8bb26"/>
  <text class="code-sm" x="980" y="207" font-size="8">opencode</text>

  <text class="mono" x="948" y="234" font-size="9" fill="#8ec07c">$</text>
  <text class="mono" x="960" y="234" font-size="9" fill="#d5c4a1">opencode</text>
  <text class="mono" x="948" y="254" font-size="9" fill="#d5c4a1">&gt; fix the parser</text>
  <text class="mono" x="948" y="272" font-size="9" fill="#d5c4a1">  cache bug</text>
  <rect class="blink" x="1014" y="262" width="6" height="12" rx="1" fill="#fabd2f"/>

  <circle cx="940" cy="336" r="2.5" fill="#8ec07c"/>
  <text class="body" x="952" y="340">Focused window</text>
  <circle cx="940" cy="358" r="2.5" fill="#fabd2f"/>
  <text class="body" x="952" y="362">Terminal · OpenCode</text>
  <circle cx="940" cy="380" r="2.5" fill="#83a598"/>
  <text class="body" x="952" y="384">Text at cursor</text>
  <circle cx="940" cy="402" r="2.5" fill="#fe8019"/>
  <text class="body" x="952" y="406">No network hop</text>

  <!-- Stage connectors -->
  <path d="M 288 280 H 328" fill="none" stroke="#fe8019" stroke-width="1.6" marker-end="url(#arrowO3)"/>
  <path d="M 580 280 H 620" fill="none" stroke="#fabd2f" stroke-width="1.6" marker-end="url(#arrowY3)"/>
  <path d="M 872 280 H 912" fill="none" stroke="#d3869b" stroke-width="1.6" marker-end="url(#arrowP3)"/>

  <circle r="3" fill="#fe8019" filter="url(#glow3)">
    <animateMotion dur="1.1s" repeatCount="indefinite" begin="0s"><mpath href="#c1"/></animateMotion>
  </circle>
  <circle r="3" fill="#fabd2f" filter="url(#glow3)">
    <animateMotion dur="1.1s" repeatCount="indefinite" begin="-0.35s"><mpath href="#c2"/></animateMotion>
  </circle>
  <circle r="3" fill="#d3869b" filter="url(#glow3)">
    <animateMotion dur="1.1s" repeatCount="indefinite" begin="-0.7s"><mpath href="#c3"/></animateMotion>
  </circle>

  <!-- Streaming token rail -->
  <rect x="36" y="478" width="1128" height="52" rx="12" fill="#282828" stroke="#504945"/>
  <text class="mono" x="52" y="509" font-size="9" letter-spacing="1.6" fill="#928374">STREAMING TOKENS</text>
  <line x1="210" y1="504" x2="1130" y2="504" stroke="#3c3836" stroke-width="2"/>
  <line x1="210" y1="504" x2="1130" y2="504" stroke="#fabd2f" stroke-width="1.5" opacity=".22" class="dash"/>

  <g transform="translate(260 504)">
    <g class="tokFlow" style="animation-delay:-0.2s">
      <rect x="-24" y="-11" width="48" height="22" rx="5" fill="#3c3836" stroke="#fabd2f" stroke-opacity=".4"/>
      <text class="token-text" x="0" y="3.5" text-anchor="middle">fix</text>
    </g>
  </g>
  <g transform="translate(560 504)">
    <g class="tokFlow" style="animation-delay:-1.5s">
      <rect x="-31" y="-11" width="62" height="22" rx="5" fill="#3c3836" stroke="#8ec07c" stroke-opacity=".4"/>
      <text class="token-text" x="0" y="3.5" text-anchor="middle">parser</text>
    </g>
  </g>
  <g transform="translate(860 504)">
    <g class="tokFlow" style="animation-delay:-2.8s">
      <rect x="-29" y="-11" width="58" height="22" rx="5" fill="#3c3836" stroke="#d3869b" stroke-opacity=".4"/>
      <text class="token-text" x="0" y="3.5" text-anchor="middle">cache</text>
    </g>
  </g>

  <text class="muted" x="600" y="570" text-anchor="middle" letter-spacing=".5">Audio, inference, and text injection all stay on the machine.</text>
</svg>
