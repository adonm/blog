<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 656" width="560" height="656" role="img" aria-labelledby="bfVoiceTitle" aria-describedby="bfVoiceDesc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" shape-rendering="geometricPrecision">
  <title id="bfVoiceTitle">Speech is transcribed on the device, and only text can optionally go remote</title>
  <desc id="bfVoiceDesc">A microphone feeds Hex, which transcribes on the device. Hex can paste the transcript into the focused app. A separate dashed branch shows that a remote rewrite or submission sends text only, not audio.</desc>
  <defs>
    <marker id="bfVoiceAudioArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#83a598"/>
    </marker>
    <marker id="bfVoiceRemoteArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#fabd2f"/>
    </marker>
  </defs>
  <style>
    .kicker { font-size: 26px; font-weight: 700; fill: #fabd2f; letter-spacing: 2.4px; }
    .h1 { font-size: 34px; font-weight: 700; fill: #ebdbb2; }
    .step { font-size: 32px; font-weight: 700; fill: #ebdbb2; }
    .step-sub { font-size: 26px; fill: #a89984; }
    .path { font-size: 26px; font-weight: 700; fill: #83a598; letter-spacing: 1.2px; }
    .remote { font-size: 30px; font-weight: 700; fill: #ebdbb2; }
    .remote-sub { font-size: 26px; fill: #d5c4a1; }
  </style>

  <rect width="560" height="656" fill="#1d2021"/>

  <text class="kicker" x="24" y="40">03 · VOICE</text>
  <text class="h1" x="24" y="82">Audio stays local</text>

  <rect x="24" y="104" width="512" height="100" rx="14" fill="#282828" stroke="#504945" stroke-width="1.5"/>
  <text class="step" x="44" y="152">Mic</text>
  <text class="step-sub" x="44" y="184">F8 in my setup</text>
  <g fill="none" stroke="#83a598" stroke-width="2.5" stroke-linecap="round">
    <rect x="486" y="136" width="16" height="28" rx="8"/>
    <path d="M 478 154 a 16 16 0 0 0 32 0"/>
    <path d="M 494 170 V 178"/>
  </g>

  <path d="M 66 206 V 234" fill="none" stroke="#83a598" stroke-width="2.5" marker-end="url(#bfVoiceAudioArrow)"/>
  <text class="path" x="80" y="229">audio</text>

  <rect x="24" y="238" width="512" height="112" rx="14" fill="#282828" stroke="#83a598" stroke-width="2"/>
  <text class="step" x="44" y="284">Hex</text>
  <text class="step-sub" x="44" y="316">transcribed on the device</text>
  <g fill="none" stroke="#83a598" stroke-width="2.5" stroke-linecap="round">
    <rect x="470" y="278" width="42" height="30" rx="4"/>
    <path d="M 488 308 V 316"/>
    <path d="M 478 316 H 504"/>
    <path d="M 482 292 h 12"/>
  </g>

  <path d="M 66 352 V 380" fill="none" stroke="#83a598" stroke-width="2.5" marker-end="url(#bfVoiceAudioArrow)"/>
  <text class="path" x="80" y="375">text</text>

  <rect x="24" y="384" width="512" height="112" rx="14" fill="#282828" stroke="#504945" stroke-width="1.5"/>
  <text class="step" x="44" y="430">Transcript</text>
  <text class="step-sub" x="44" y="462">paste into the focused app</text>
  <g fill="none" stroke="#ebdbb2" stroke-width="2" stroke-linecap="round">
    <path d="M 486 424 h 16 l 8 8 v 26 h -24 z"/>
    <path d="M 494 438 h 10 M 494 448 h 10"/>
  </g>

  <path d="M 280 498 V 528" fill="none" stroke="#fabd2f" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#bfVoiceRemoteArrow)"/>
  <text class="path" x="296" y="521">text only</text>

  <rect x="24" y="532" width="512" height="100" rx="14" fill="#282828" stroke="#fabd2f" stroke-width="2" stroke-dasharray="7 6" stroke-opacity=".65"/>
  <text class="remote" x="44" y="578">Remote model, optional</text>
  <text class="remote-sub" x="44" y="610">rewrite or submit</text>
</svg>
