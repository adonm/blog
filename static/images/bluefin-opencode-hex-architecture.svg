<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="bfArchTitle" aria-describedby="bfArchDesc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" shape-rendering="geometricPrecision">
  <title id="bfArchTitle">A stock Bluefin host and one Debian dev container sharing a home directory</title>
  <desc id="bfArchDesc">Bluefin DX runs on the host with Hex for voice input. A Debian 13 Distrobox named dev runs OpenCode and mise toolchains. Both read the same home directory, which is shared for convenience and is not a sandbox.</desc>
  <defs>
    <marker id="bfArchArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#83a598"/>
    </marker>
  </defs>
  <style>
    .kicker { font-size: 26px; font-weight: 700; fill: #fabd2f; letter-spacing: 2.4px; }
    .h1 { font-size: 34px; font-weight: 700; fill: #ebdbb2; }
    .label { font-size: 26px; font-weight: 700; fill: #a89984; letter-spacing: 2px; }
    .title { font-size: 32px; font-weight: 700; fill: #ebdbb2; }
    .sub { font-size: 28px; fill: #d5c4a1; }
    .mono { font-family: ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
  </style>

  <rect width="560" height="480" fill="#1d2021"/>

  <text class="kicker" x="24" y="40">01 · MACHINE</text>
  <text class="h1" x="24" y="82">One host, one dev box</text>

  <rect x="24" y="108" width="248" height="228" rx="14" fill="#282828" stroke="#504945" stroke-width="1.5"/>
  <text class="label" x="44" y="144">HOST</text>
  <g fill="none" stroke="#a89984" stroke-width="2" stroke-linecap="round">
    <rect x="226" y="122" width="26" height="18" rx="2"/>
    <path d="M 239 140 V 146"/>
    <path d="M 231 146 H 247"/>
  </g>
  <text class="title" x="44" y="182">Bluefin DX</text>
  <text class="sub" x="44" y="212">stock, atomic</text>
  <line x1="44" y1="230" x2="252" y2="230" stroke="#3c3836" stroke-width="2"/>
  <text class="title" x="44" y="266" fill="#83a598">Hex</text>
  <text class="sub" x="44" y="296">voice input</text>
  <g fill="none" stroke="#83a598" stroke-width="2" stroke-linecap="round">
    <rect x="236" y="248" width="14" height="24" rx="7"/>
    <path d="M 231 262 a 12 12 0 0 0 24 0"/>
    <path d="M 243 274 V 280"/>
  </g>

  <rect x="288" y="108" width="248" height="228" rx="14" fill="#282828" stroke="#504945" stroke-width="1.5"/>
  <text class="label" x="308" y="144">CONTAINER</text>
  <g fill="none" stroke="#a89984" stroke-width="2" stroke-linejoin="round">
    <path d="M 504 122 L 517 129 V 143 L 504 150 L 491 143 V 129 Z"/>
    <path d="M 491 129 L 504 136 L 517 129"/>
    <path d="M 504 136 V 150"/>
  </g>
  <text class="title" x="308" y="182">Debian dev</text>
  <text class="sub" x="308" y="212">Distrobox</text>
  <line x1="308" y1="230" x2="516" y2="230" stroke="#3c3836" stroke-width="2"/>
  <text class="title" x="308" y="266" fill="#fabd2f">OpenCode</text>
  <text class="sub" x="308" y="296">mise tools</text>

  <path d="M 148 336 V 356" fill="none" stroke="#83a598" stroke-width="2" marker-end="url(#bfArchArrow)"/>
  <path d="M 412 336 V 356" fill="none" stroke="#83a598" stroke-width="2" marker-end="url(#bfArchArrow)"/>

  <rect x="24" y="360" width="512" height="88" rx="14" fill="#32302f" stroke="#504945" stroke-width="1.5"/>
  <text class="mono" x="44" y="400" font-size="34" font-weight="700" fill="#83a598">$HOME</text>
  <text class="sub" x="44" y="430">shared files · not a sandbox</text>
</svg>
