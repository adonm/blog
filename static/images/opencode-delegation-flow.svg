<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 544" width="560" height="544" role="img" aria-labelledby="bfFlowTitle" aria-describedby="bfFlowDesc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" shape-rendering="geometricPrecision">
  <title id="bfFlowTitle">Brief, check, and commit, with publishing held for an explicit request</title>
  <desc id="bfFlowDesc">Three steps run in order. Write a short brief and delegate. Exercise the changed behavior with the smallest real check. Commit locally in small commits. A separate dashed callout reads publish only on request: push, pull request, and deploy wait for an explicit yes.</desc>
  <defs>
    <marker id="bfFlowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#fabd2f"/>
    </marker>
  </defs>
  <style>
    .kicker { font-size: 26px; font-weight: 700; fill: #fabd2f; letter-spacing: 2.4px; }
    .h1 { font-size: 34px; font-weight: 700; fill: #ebdbb2; }
    .step { font-size: 32px; font-weight: 700; fill: #ebdbb2; }
    .step-sub { font-size: 26px; fill: #a89984; }
    .num { font-size: 26px; font-weight: 700; fill: #fabd2f; }
    .callout { font-size: 30px; font-weight: 700; fill: #ebdbb2; }
    .callout-sub { font-size: 26px; fill: #d5c4a1; }
  </style>

  <rect width="560" height="544" fill="#1d2021"/>

  <text class="kicker" x="24" y="40">02 · WORKFLOW</text>
  <text class="h1" x="24" y="82">Brief, check, commit</text>

  <rect x="24" y="108" width="512" height="80" rx="14" fill="#282828" stroke="#504945" stroke-width="1.5"/>
  <circle cx="66" cy="148" r="18" fill="#3c3836" stroke="#fabd2f" stroke-width="2"/>
  <text class="num" x="66" y="156" text-anchor="middle">1</text>
  <text class="step" x="100" y="142">Brief and delegate</text>
  <text class="step-sub" x="100" y="172">goal · scope · done</text>

  <path d="M 66 188 V 206" fill="none" stroke="#fabd2f" stroke-width="2" marker-end="url(#bfFlowArrow)"/>

  <rect x="24" y="212" width="512" height="80" rx="14" fill="#282828" stroke="#504945" stroke-width="1.5"/>
  <circle cx="66" cy="252" r="18" fill="#3c3836" stroke="#fabd2f" stroke-width="2"/>
  <text class="num" x="66" y="260" text-anchor="middle">2</text>
  <text class="step" x="100" y="246">Exercise the change</text>
  <text class="step-sub" x="100" y="276">smallest real test</text>

  <path d="M 66 292 V 310" fill="none" stroke="#fabd2f" stroke-width="2" marker-end="url(#bfFlowArrow)"/>

  <rect x="24" y="316" width="512" height="80" rx="14" fill="#282828" stroke="#504945" stroke-width="1.5"/>
  <circle cx="66" cy="356" r="18" fill="#3c3836" stroke="#fabd2f" stroke-width="2"/>
  <text class="num" x="66" y="364" text-anchor="middle">3</text>
  <text class="step" x="100" y="350">Commit locally</text>
  <text class="step-sub" x="100" y="380">small, checked commits</text>

  <rect x="24" y="432" width="512" height="88" rx="14" fill="#282828" stroke="#fabd2f" stroke-width="2" stroke-dasharray="7 6" stroke-opacity=".65"/>
  <g fill="none" stroke="#fabd2f" stroke-width="2" stroke-linecap="round">
    <rect x="54" y="473" width="24" height="16" rx="3"/>
    <path d="M 58 473 v-7 a8 8 0 0 1 16 0 v7"/>
  </g>
  <text class="callout" x="100" y="470">Publish only on request</text>
  <text class="callout-sub" x="100" y="500">push · PR · deploy</text>
</svg>
